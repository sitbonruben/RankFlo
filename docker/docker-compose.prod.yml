version: "3.9"

# Production deployment — uses shared Caddy proxy on the server
# Usage:
#   1. Copy .env.example to .env.production and fill in values
#   2. docker compose -f docker/docker-compose.prod.yml up -d --build

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    expose:
      - "3000"
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://rankflo.io
      RANKFLO_MODE: oss
      DATABASE_URL: postgresql://${POSTGRES_USER:-rankflo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rankflo}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - proxy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rankflo}
      POSTGRES_USER: ${POSTGRES_USER:-rankflo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rankflo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  internal:
  proxy:
    external: true
