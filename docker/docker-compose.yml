version: "3.9"

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://rankflo:rankflo@postgres:5432/rankflo
      REDIS_URL: redis://redis:6379
      RANKFLO_MODE: oss
      AUTH_SECRET: change-this-to-a-random-32-char-string
      ADMIN_EMAIL: admin@rankflo.io
      ADMIN_PASSWORD: change-this-immediately
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SEED_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rankflo
      POSTGRES_USER: rankflo
      POSTGRES_PASSWORD: rankflo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rankflo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
