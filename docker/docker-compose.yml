version: "3.9"

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_RANKFLO_MODE: ${NEXT_PUBLIC_RANKFLO_MODE:-saas}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://rankflo.io}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY: ${NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY:-}
        NEXT_PUBLIC_STRIPE_PRICE_PRO_ANNUAL: ${NEXT_PUBLIC_STRIPE_PRICE_PRO_ANNUAL:-}
        NEXT_PUBLIC_SELF_PROJECT_ID: ${NEXT_PUBLIC_SELF_PROJECT_ID:-}
        NEXT_PUBLIC_SELF_PROJECT_KEY: ${NEXT_PUBLIC_SELF_PROJECT_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ../.env.production
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - proxy
    restart: unless-stopped

  docs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.docs
    ports:
      - "127.0.0.1:3003:3001"
    networks:
      - default
      - proxy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rankflo}
      POSTGRES_USER: ${POSTGRES_USER:-rankflo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rankflo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  default:
  proxy:
    external: true
